<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HeartLink | اطلب هديتك الآن</title>
  <meta name="description" content="أنشئ طلبك في دقائق — تجربة طلب احترافية من HeartLink" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    :root{
      --primary:#6366f1;
      --secondary:#8b5cf6;
      --accent:#06b6d4;
      --bg:#030712;
      --glass:rgba(15,23,42,.6);
      --glass-border:rgba(255,255,255,.08);
      --text:#f8fafc;
      --text-dim:#94a3b8;
      --success:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
    }
    .light-mode{
      --bg:#f8fafc;
      --glass:rgba(255,255,255,.82);
      --glass-border:rgba(0,0,0,.06);
      --text:#0f172a;
      --text-dim:#64748b;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Segoe UI',system-ui,sans-serif}
    body{
      background:var(--bg);
      color:var(--text);
      margin:0;
      height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      transition:.5s cubic-bezier(.4,0,.2,1);
    }

    .bg-glow{
      position:fixed;
      width:520px;height:520px;
      background:radial-gradient(circle,var(--primary) 0%, transparent 70%);
      filter:blur(130px);
      opacity:.16;
      z-index:-1;
      animation:floating 16s infinite alternate ease-in-out;
    }
    .bg-glow.b2{
      right:-180px;bottom:-160px;
      background:radial-gradient(circle,var(--accent) 0%, transparent 70%);
      opacity:.12;
      animation-duration:18s;
    }
    @keyframes floating{
      0%{transform:translate(-20%,-20%)}
      100%{transform:translate(25%,22%)}
    }

    header{
      padding:14px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:100;
      height:90px;
      animation:fadeInDown .7s ease;
      gap:12px;
    }
    .header-tagline{
      display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:0
    }
    .tagline-main{
      font-size:15px;font-weight:900;white-space:nowrap;letter-spacing:.2px;color:#ffffff;
      display:flex;align-items:center;gap:8px;min-width:0
    }
    .tagline-main .pill{
      font-size:10px;font-weight:900;
      padding:6px 10px;border-radius:999px;
      background:rgba(99,102,241,.12);
      border:1px solid rgba(99,102,241,.28);
      color:var(--text);
      letter-spacing:.6px;
      flex:0 0 auto;
    }
    .tagline-main i{
      color:#ffd700;font-size:13px;
      filter:drop-shadow(0 0 6px rgba(255,215,0,.35));
      animation:crownPulse 2s infinite ease-in-out;
      flex:0 0 auto;
    }
    .tagline-sub{
      font-size:9px;color:var(--primary);font-weight:800;letter-spacing:1.6px;opacity:.85;text-transform:uppercase
    }
    @keyframes crownPulse{
      0%,100%{transform:scale(1) rotate(0deg)}
      50%{transform:scale(1.18) rotate(10deg)}
    }

    .theme-toggle{
      width:42px;height:42px;border-radius:14px;background:var(--glass);
      border:1px solid var(--glass-border);color:var(--text);cursor:pointer;
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      display:flex;align-items:center;justify-content:center;transition:.25s;
      box-shadow:0 10px 28px rgba(0,0,0,.22);
      flex:0 0 auto;
    }
    .theme-toggle:active{transform:scale(.92)}

    main{
      flex:1;
      padding:0 18px;
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      margin-bottom:26px;
    }

    .wrap{
      width:100%;
      max-width:520px;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .glass-card{
      width:100%;
      background:var(--glass);
      backdrop-filter:blur(42px);
      -webkit-backdrop-filter:blur(42px);
      border:1px solid var(--glass-border);
      border-radius:34px;
      box-shadow:0 28px 60px -14px rgba(0,0,0,.62);
      overflow:hidden;
      position:relative;
      display:flex;
      flex-direction:column;
      max-height:calc(100dvh - 110px);
    }

    .card-top{
      padding:16px 16px 12px;
      border-bottom:1px solid var(--glass-border);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .progress-row{
      display:flex;align-items:center;justify-content:space-between;gap:10px
    }
    .step-dots{
      display:flex;align-items:center;gap:8px
    }
    .dot{
      width:9px;height:9px;border-radius:50%;
      background:rgba(148,163,184,.28);
      border:1px solid rgba(148,163,184,.18);
      transition:.25s;
    }
    .dot.active{background:rgba(99,102,241,.9);border-color:rgba(99,102,241,.5);box-shadow:0 0 0 6px rgba(99,102,241,.12)}
    .dot.done{background:rgba(34,197,94,.95);border-color:rgba(34,197,94,.55)}
    .top-actions{
      display:flex;align-items:center;gap:8px
    }
    .mini-btn{
      height:34px;border-radius:12px;
      background:rgba(255,255,255,.03);
      border:1px solid var(--glass-border);
      color:var(--text);
      padding:0 12px;
      display:flex;align-items:center;gap:8px;
      font-weight:900;
      cursor:pointer;
      transition:.25s;
    }
    .mini-btn i{opacity:.9}
    .mini-btn:active{transform:scale(.97)}
    .mini-btn.danger{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}
    .mini-btn.danger i{color:var(--danger)}

    .title-row{
      display:flex;align-items:center;justify-content:space-between;gap:10px
    }
    .title-row h1{
      margin:0;
      font-size:16px;
      font-weight:1000;
      letter-spacing:.2px;
      display:flex;align-items:center;gap:10px;
    }
    .title-row h1 span{
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .subtitle{
      margin:0;
      font-size:11px;
      color:var(--text-dim);
      line-height:1.55;
    }

    .bar{
      height:10px;border-radius:999px;background:rgba(148,163,184,.16);
      overflow:hidden;border:1px solid var(--glass-border);
    }
    .bar > div{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));
      border-radius:999px;
      transition:.35s cubic-bezier(.4,0,.2,1);
      box-shadow:0 10px 20px rgba(99,102,241,.18);
    }

    .card-body{
      padding:14px 16px 16px;
      overflow:auto;
      scrollbar-width:none;
    }
    .card-body::-webkit-scrollbar{display:none}

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }

    .section{
      background:rgba(255,255,255,.02);
      border:1px solid var(--glass-border);
      border-radius:26px;
      padding:14px;
    }

    .section-h{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .section-h h2{
      margin:0;
      font-size:13px;
      font-weight:1000;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .section-h h2 i{
      width:34px;height:34px;border-radius:14px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(99,102,241,.12);
      border:1px solid rgba(99,102,241,.25);
      color:var(--primary);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .field{
      flex:1 1 140px;
      min-width:140px;
    }
    label{
      display:block;
      font-size:10px;
      color:var(--text-dim);
      font-weight:900;
      letter-spacing:.4px;
      margin:0 6px 6px 0;
    }
    input, select, textarea{
      width:100%;
      background:rgba(255,255,255,.02);
      border:1px solid var(--glass-border);
      color:var(--text);
      border-radius:16px;
      padding:12px 12px;
      outline:none;
      transition:.25s;
      font-size:12px;
    }
    textarea{min-height:92px;resize:none;line-height:1.6}
    input:focus, select:focus, textarea:focus{
      border-color:rgba(99,102,241,.55);
      box-shadow:0 0 0 6px rgba(99,102,241,.12);
    }

    .phone-input-group {
      display: flex;
      gap: 8px;
      direction: ltr; 
    }
    .phone-input-group select {
      flex: 0 0 100px;
      padding: 12px 4px;
      font-size: 11px;
      text-align: center;
    }

    .chips{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap:10px;
    }
    .chip{
      cursor:pointer;
      user-select:none;
      border-radius:18px;
      padding:10px 8px;
      background:rgba(255,255,255,.02);
      border:1px solid var(--glass-border);
      display:flex;
      align-items:center;
      gap:8px;
      transition:.25s;
    }
    .chip .ic{
      width:32px;height:32px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.03);
      border:1px solid var(--glass-border);
      color:var(--text);
      flex:0 0 auto;
      font-size: 14px;
    }
    .chip b{
      font-size:11px;
      font-weight:1000;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .chip.active{
      border-color:rgba(99,102,241,.6);
      background:rgba(99,102,241,.10);
      transform:translateY(-2px);
    }
    .chip.active .ic{background:linear-gradient(135deg,var(--primary),var(--secondary));border-color:transparent;color:#fff}

    .summary{
      border-radius:26px;
      border:1px dashed rgba(99,102,241,.45);
      background:rgba(99,102,241,.06);
      padding:14px;
    }
    .summary h3{
      margin:0 0 10px 0;
      font-size:12px;
      font-weight:1000;
      display:flex;align-items:center;gap:10px
    }
    .summary h3 i{color:var(--primary)}
    .sum-list{margin:0;padding:0 18px 0 0;font-size:11px;color:var(--text);line-height:1.7}
    .sum-list li{margin:4px 0}

    .footer-actions{
      padding:12px 16px 16px;
      border-top:1px solid var(--glass-border);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.10) 100%);
    }
    .btn{
      flex:1 1 160px;
      min-width:160px;
      height:48px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      cursor:pointer;
      font-weight:1000;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      transition:.25s;
      color:#fff;
      text-decoration:none;
    }
    .btn:active{transform:scale(.97)}
    .btn.primary{
      background:linear-gradient(135deg,var(--primary),var(--secondary));
      box-shadow:0 14px 28px rgba(99,102,241,.22);
    }
    .btn.ghost{
      background:rgba(255,255,255,.03);
      border:1px solid var(--glass-border);
      color:var(--text);
    }
    .btn.success{
      background:linear-gradient(135deg, var(--success), #16a34a);
      box-shadow:0 14px 28px rgba(34,197,94,.20);
    }
    .btn.whatsapp{
      background:#25D366;
      box-shadow:0 14px 28px rgba(37,211,102,.18);
    }
    .btn.disabled{
      opacity:.55;
      pointer-events:none;
      filter:saturate(.6);
    }

    .toast{
      position:fixed;
      bottom:22px;
      left:50%;
      transform:translateX(-50%);
      padding:12px 14px;
      border-radius:16px;
      background:rgba(0,0,0,.55);
      color:#fff;
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 18px 40px rgba(0,0,0,.35);
      z-index:9999;
      display:none;
      font-size:12px;
      font-weight:900;
      gap:10px;
      align-items:center;
    }
    .toast.show{display:flex;animation:fadeInUp .25s ease}

    .success-screen{
      text-align:center;
      padding:8px 2px;
    }
    .success-icon{
      width:84px;height:84px;border-radius:50%;
      margin:4px auto 12px;
      display:flex;align-items:center;justify-content:center;
      background:rgba(34,197,94,.14);
      border:1px solid rgba(34,197,94,.28);
      box-shadow:0 18px 40px rgba(34,197,94,.12);
      animation:pulse 1.4s infinite ease-in-out;
    }
    .success-icon i{font-size:34px;color:var(--success)}
    .order-number-badge{
      background:rgba(99,102,241,.12);
      border:1px solid rgba(99,102,241,.2);
      padding:8px 16px;
      border-radius:12px;
      display:inline-block;
      margin:10px 0;
      font-family:monospace;
      font-weight:bold;
      color:var(--primary);
    }
    @keyframes pulse{
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.06)}
    }

    .footer-copyright-tag{
      position:fixed;
      bottom:8px;
      left:0;
      width:100%;
      text-align:center;
      font-size:9px;
      color:var(--text-dim);
      opacity:.55;
      z-index:999;
      pointer-events:none;
      letter-spacing:1px;
    }

    @keyframes fadeInDown{ from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeInUp{ from{opacity:0;transform:translate(-50%, 12px)} to{opacity:1;transform:translate(-50%, 0)} }

    .req{color:#ffd700;font-weight:1000}
  </style>
</head>

<body>

  <div class="bg-glow b2"></div>

      <div class="tagline-main">

  const OCCASIONS = [

    { n: "إسبانيا", c: "+34" }, { n: "روسيا", c: "+7" }, { n: "الصين", c: "+86" }, { n: "اليابان", c: "+81" },

  const steps = [{ title: "المناسبة" }, { title: "البيانات" }, { title: "نوع الهدية" }, { title: "مراجعة" }];

  function generateOrderID() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let result = '';
    for (let i = 0; i < 12; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function load(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) Object.assign(state, JSON.parse(raw));
  }
  function toast(msg){
    const t = document.getElementById("toast");
    document.getElementById("toastText").textContent = msg;
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 1600);
  }

  function toggleTheme(){
    document.body.classList.toggle("light-mode");
    const icon = document.getElementById("theme-icon");
    icon.className = document.body.classList.contains("light-mode") ? "fa-solid fa-sun" : "fa-solid fa-moon";
  }

  function render(){
    save();
    renderDots();
    document.getElementById("barFill").style.width = Math.round(((state.step) / (steps.length-1)) * 100) + "%";
    
    const body = document.getElementById("cardBody");
    if(state.step === 0) body.innerHTML = stepOccasion();
    else if(state.step === 1) body.innerHTML = stepDetails();
    else if(state.step === 2) body.innerHTML = stepGiftType();
    else if(state.step === 3) body.innerHTML = stepReview();
    
    renderFooter();
    wireEvents();
  }

  function renderDots(){
    const el = document.getElementById("dots");
    el.innerHTML = "";
    steps.forEach((s, i)=>{
      const d = document.createElement("div");
      d.className = "dot" + (i === state.step ? " active" : "") + (i < state.step ? " done" : "");
      el.appendChild(d);
    });
  }

  function renderFooter(){
    const f = document.getElementById("footerActions");
    if(state.step < steps.length - 1){
      f.innerHTML = `
        <button class="btn ghost ${state.step === 0 ? "disabled" : ""}" onclick="prevStep()">رجوع</button>
        <button class="btn primary" onclick="nextStep()">التالي</button>
      `;
    } else if (state.step === steps.length - 1) {
      f.innerHTML = `
        <button class="btn success" onclick="finish()">تأكيد الطلب</button>
        <button class="btn ghost" onclick="prevStep()">تعديل</button>
      `;
    }
  }

  function stepOccasion(){
    return `
      <div class="grid">
        <div class="section">
          <div class="section-h"><h2><i class="fa-solid fa-calendar-heart"></i> اختار المناسبة <span class="req">*</span></h2></div>
          <div class="chips" id="occChips">
            ${OCCASIONS.map(o => `<div class="chip ${state.occasion === o.key ? "active" : ""}" data-val="${o.key}"><div class="ic"><i class="fa-solid ${o.icon}"></i></div><b>${o.key}</b></div>`).join("")}
          </div>
          ${(state.occasion === "مناسبة خاصة") ? `<div style="margin-top:15px" class="animate__animated animate__fadeIn"><label>فكرة الهدية/المناسبة <span class="req">*</span></label><textarea id="customIdea" placeholder="اشرح لنا تفاصيل المناسبة أو فكرتك للهدية...">${state.customIdea}</textarea></div>` : ""}
        </div>
      </div>
    `;
  }

  function stepDetails(){
    return `
      <div class="grid">
        <div class="section">
          <div class="section-h"><h2><i class="fa-solid fa-user-tag"></i> بيانات التواصل <span class="req">*</span></h2></div>
          <div class="row">
            <div class="field"><label>اسمك <span class="req">*</span></label><input id="customerName" value="${state.customerName}" placeholder="اكتب اسمك هنا" /></div>
            <div class="field">
              <label>رقم التواصل (واتساب) <span class="req">*</span></label>
              <div class="phone-input-group">
                <input type="tel" id="contact" value="${state.contact}" placeholder="رقم الموبايل" style="flex:1" />
                <select id="countryCode">
                  ${COUNTRY_CODES.map(c => `<option value="${c.c}" ${state.countryCode === c.c ? "selected" : ""}>${c.c} ${c.n}</option>`).join("")}
                </select>
              </div>
            </div>
          </div>
          <div class="row" style="margin-top:10px">
            <div class="field"><label>ملاحظات إضافية</label><textarea id="notes" placeholder="أي تفاصيل تانية عايز تقولها؟">${state.notes}</textarea></div>
          </div>
        </div>
      </div>
    `;
  }

  function stepGiftType(){
    return `
      <div class="grid">
        <div class="section">
          <div class="section-h"><h2><i class="fa-solid fa-gift"></i> محتاج الهدية إيه؟ <span class="req">*</span></h2></div>
          <p style="font-size:10px; color:var(--text-dim); margin-bottom:12px;">يمكنك اختيار أكثر من نوع</p>
          <div class="chips" id="giftTypeChips">
            ${GIFT_OPTIONS.map(g => `
              <div class="chip ${state.giftTypes.includes(g.key) ? "active" : ""}" data-val="${g.key}">
                <div class="ic"><i class="fa-solid ${g.icon}"></i></div>
                <b>${g.key}</b>
              </div>`).join("")}
          </div>
        </div>
      </div>
    `;
  }

  function stepReview(){
    let cleanContact = state.contact.startsWith('0') ? state.contact.substring(1) : state.contact;
    return `
      <div class="grid">
        <div class="summary">
          <h3><i class="fa-solid fa-clipboard-check"></i> مراجعة البيانات</h3>
          <ul class="sum-list">
            <li>المناسبة: <b>${state.occasion}</b></li>
            <li>الاسم: <b>${state.customerName}</b></li>
            <li>الهدية المطلوبة: <b>${state.giftTypes.join(" + ") || "لم يحدد"}</b></li>
            ${state.customIdea ? `<li>التفاصيل: <b>${state.customIdea}</b></li>` : ""}
            <li>رقم التواصل: <b dir="ltr">${state.countryCode} ${cleanContact}</b></li>
            ${state.notes ? `<li>ملاحظات إضافية: <b>${state.notes}</b></li>` : ""}
          </ul>
        </div>
      </div>
    `;
  }

  function wireEvents(){
    document.querySelectorAll("#occChips .chip").forEach(c => {
      c.onclick = () => { 
        state.occasion = c.dataset.val; 
        if(state.occasion !== "مناسبة خاصة") state.customIdea = "";
        render(); 
      };
    });

    document.querySelectorAll("#giftTypeChips .chip").forEach(c => {
      c.onclick = () => {
        const val = c.dataset.val;
        if(state.giftTypes.includes(val)){
          state.giftTypes = state.giftTypes.filter(t => t !== val);
        } else {
          state.giftTypes.push(val);
        }
        render();
      };
    });

    const ids = ["customIdea", "customerName", "contact", "notes", "countryCode"];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if(el) el.oninput = (e) => { 
        state[id] = e.target.value; 
        save(); 
      };
    });
  }

  function nextStep(){
    if(state.step===0){
       if(!state.occasion) return toast("اختار المناسبة");
       if(state.occasion === "مناسبة خاصة" && !state.customIdea.trim()) return toast("اكتب تفاصيل الفكرة");
    }
    if(state.step===1 && (!state.customerName || !state.contact)) return toast("كمل البيانات المطلوبة");
    if(state.step===2 && state.giftTypes.length === 0) return toast("اختار نوع الهدية على الأقل واحد");
    state.step++; render();
  }
  function prevStep(){ state.step--; render(); }

  async function sendToTelegram() {
    let cleanContact = state.contact.startsWith('0') ? state.contact.substring(1) : state.contact;
    let fullContact = `${state.countryCode} ${cleanContact}`;
    const now = new Date().toLocaleString('ar-EG');

    let tgMsg = `🎁 *طلب جديد من HeartLink*\n`;
    tgMsg += `━━━━━━━━━━━━━━\n`;
    tgMsg += `📅 *الوقت:* ${now}\n`;
    tgMsg += `🎈 *المناسبة:* ${state.occasion}\n`;
    tgMsg += `🎀 *النوع:* ${state.giftTypes.join(" + ")}\n`;
    tgMsg += `💡 *الفكرة:* ${state.customIdea || "تلقائي"}\n`;
    tgMsg += `👤 *العميل:* ${state.customerName}\n`;
    tgMsg += `📞 *رقم الواتساب:* ${fullContact}\n`;
    tgMsg += `🆔 *رقم الطلب:* ${state.orderID}\n`;
    if(state.notes) tgMsg += `📝 *ملاحظات:* ${state.notes}\n`;
    tgMsg += `━━━━━━━━━━━━━━`;

    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: tgMsg, parse_mode: 'Markdown' })
      });
    } catch (e) { console.error(e); }
  }

  function finish(){
    state.orderID = generateOrderID(); 
    sendToTelegram();
    
    // التعديل الجديد لصيغة الرسالة
    const ideaVal = state.customIdea || "تلقائي";
    const waMsg = `مرحبا HeartLink\nعندي طلب لهدية [${state.occasion}] باسم [${state.customerName}]، التفاصيل: [${ideaVal}]. رقم الطلب: [${state.orderID}]`;
    const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(waMsg)}`;

    document.getElementById("cardBody").innerHTML = `
      <div class="success-screen animate__animated animate__zoomIn">
        <div class="success-icon"><i class="fa-solid fa-check"></i></div>
        <h3>تم تأكيد طلبك بنجاح!</h3>
        <div class="order-number-badge">ID: ${state.orderID}</div>
        <p>اضغط على الزر بالأسفل لإرسال الطلب عبر واتساب ومتابعة التنفيذ.</p>
      </div>
    `;

    document.getElementById("footerActions").innerHTML = `
      <a href="${waLink}" class="btn whatsapp animate__animated animate__pulse animate__infinite" target="_blank">
        <i class="fa-brands fa-whatsapp"></i> تواصل واتساب وتابع طلبك أسرع
      </a>
      <button class="btn ghost" onclick="resetAll()">طلب جديد</button>
    `;

    document.getElementById("barFill").style.width = "100%";
    document.querySelectorAll(".dot").forEach(d => d.classList.add("done"));
  }

  function resetAll(){ 
    if(confirm("متأكد انك عايز تبدأ طلب جديد؟")){ 
      localStorage.removeItem(STORAGE_KEY); 
      state.step = 0;
      state.occasion = "";
      state.customIdea = "";
      state.customerName = "";
      state.contact = "";
      state.notes = "";
      state.orderID = "";
      state.giftTypes = [];
      location.reload(); 
    } 
  }

  load(); render();
</script>
</body>
</html>
